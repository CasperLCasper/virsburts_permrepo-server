<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PermRepo - Backup</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .section { margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 8px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box; }
        .status { margin-top: 10px; color: green; font-weight: bold; white-space: pre-wrap; }
        .error { margin-top: 10px; color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>PermRepo - Izveidot backupu</h1>

    <div id="authSection" class="section">
        <button id="loginButton">Pieslēgties ar GitHub</button>
    </div>

    <div id="userSection" class="section" style="display: none;">
        <p>Pieslēdzies kā: <strong id="userName"></strong></p>
        <button id="logoutButton">Atslēgties</button>
    </div>

    <div id="repoSection" class="section" style="display: none;">
        <h3>Izvēlies repozitoriju</h3>
        <select id="repoSelect">
            <option value="">Lādē repozitorijus...</option>
        </select>
    </div>

    <div id="walletSection" class="section" style="display: none;">
        <h3>Seifs</h3>
        <input type="text" id="walletInput" placeholder="Savienot ar MetaMask..." readonly>
    </div>

    <div id="statusSection" class="section" style="display: none;">
        <h3>Statusa pārbaude</h3>
        <p id="nftStatus">⏳ Pārbauda NFT...</p>
        <p id="subscriptionStatus">⏳ Pārbauda abonementu...</p>
        <button id="backupButton" style="display: none;">Sākt backupu</button>
    </div>

    <div id="status" class="status"></div>
    <div id="error" class="error"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.11.1/ethers.umd.min.js"></script>
    <script type="module" src="/js/backup.bundle.js"></script>
</body>
</html>
